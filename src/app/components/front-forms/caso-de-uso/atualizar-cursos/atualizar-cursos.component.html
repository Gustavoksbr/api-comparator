<form [formGroup]="formulario">
  <h3>Altere um curso</h3>
  <div class="campo">
    <label for="codigo">Código atual:</label>
    <input
      id="codigo"
      formControlName="codigo"
      type="text"
      [maxLength]="15"
      data-test-id="alterar-input-codigo"
    />
    <div class="contador-caracteres">
      {{ this.cursoAtual().codigo?.length || 0 }}/15
    </div>
  </div>
  <div class="campo">
    <label for="codigoNovo">Código novo:</label>
    <input
      id="codigoNovo"
      formControlName="codigoNovo"
      type="text"
      [maxLength]="15"
      data-test-id="alterar-input-codigo-novo"
    />
    <div class="contador-caracteres">
      {{ this.cursoAtual().codigoNovo?.length || 0 }}/15
    </div>
  </div>
  <div class="campo">
    <label for="titulo">Título novo:</label>
    <input
      id="titulo"
      type="text"
      formControlName="titulo"
      [maxLength]="30"
      data-test-id="alterar-input-titulo"
    />
    <div class="contador-caracteres">
      {{ this.cursoAtual().titulo?.length || 0 }}/30
    </div>
  </div>
  <div class="campo">
    <label for="descricao">Descrição nova:</label>
    <textarea
      id="descricao"
      type="text"
      formControlName="descricao"
      [maxLength]="100"
      data-test-id="alterar-textarea-descricao"
    ></textarea>
    <div class="contador-caracteres">
      {{ this.cursoAtual().descricao?.length || 0 }}/100
    </div>
  </div>
  <div class="campo">
    <label for="cargahoraria">Carga horária nova:</label>
    <input
      id="cargahoraria"
      type="number"
      formControlName="cargaHoraria"
      [max]="300"
      data-test-id="alterar-input-carga-horaria"
    />
  </div>
  <div class="mensagem-campo-vazio">
    Obs: Deixe o campo vazio caso não queira alterar o valor.
  </div>
</form>
